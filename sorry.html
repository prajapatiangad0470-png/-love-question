<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
}

.card {
  width: 90%;
  max-width: 380px;
  padding: 35px 25px;
  text-align: center;
  background: white;
  border-radius: 25px;
  box-shadow: 0 15px 40px rgba(0,0,0,.25);
  z-index: 10;
}

.emoji {
  font-size: 70px;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  50% { transform: scale(1.15); }
}

h1 {
  color: #ff3f68;
  margin: 15px 0 25px;
}

input {
  width: 100%;
  padding: 14px;
  border: 2px solid #ffd0da;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #ff3f68;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

#message {
  min-height: 30px;
  margin-top: 20px;
  color: #ff3f68;
  font-size: 21px;
  font-weight: bold;
}

/* Floating hearts */
.heart {
  position: fixed;
  bottom: -60px;
  font-size: 35px;
  pointer-events: none;
  animation: floatUp 3s linear forwards;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) scale(.3) rotate(0deg);
    opacity: 0;
  }

  15% {
    opacity: 1;
    transform: scale(1.2);
  }

  100% {
    transform: translateY(-110vh) scale(1) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="emoji">🥺</div>

  <h1>I'm Sorry ❤️</h1>

  <input
    id="answer"
    type="text"
    placeholder="Type your answer..."
    autocomplete="off"
  >

  <button onclick="checkAnswer()">Submit ❤️</button>

  <div id="message"></div>

</div>

<script>
function checkAnswer() {

  const input = document.getElementById("answer");
  const message = document.getElementById("message");

  const answer = input.value.trim().toLowerCase();

  if (
    answer === "thik hai" ||
    answer === "theek hai" ||
    answer === "thik h" ||
    answer === "theek h" ||
    answer === "ok" ||
    answer === "okay"
  ) {

    message.innerHTML = "Thank you ❤️🥺";

    // Heart pop-up animation
    for (let i = 0; i < 35; i++) {

      const heart = document.createElement("div");

      heart.className = "heart";

      const hearts = ["❤️", "💕", "💗", "💖"];
      heart.innerHTML =
        hearts[Math.floor(Math.random() * hearts.length)];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDelay =
        Math.random() * 1.5 + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 4000);
    }

  } else {

    message.innerHTML = "Please forgive me 🥺❤️";

    setTimeout(() => {
      message.innerHTML = "";
      input.value = "";
      input.focus();
    }, 1500);
  }
}

// Enter key se bhi submit hoga
document.getElementById("answer").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    checkAnswer();
  }
});
</script>

</body>
</html>
